spring:
  application:
    name: edu-admin
  #Redis：只用来缓存权限数据。连不上不影响启动，读失败会自动回落到查库
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 超时设短一点：Redis 出问题时请求最多卡半秒，不至于把整个鉴权拖住
      # 不设的话默认可能等几十秒，表现出来就是"接口全部超时"
      timeout: 500ms
  #数据库的连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/tlias
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234
  servlet:
    multipart:
      # 单个上传文件最大大小
      max-file-size: 10MB
      # 一次http请求整体最大大小（多个文件+表单参数总和）
      max-request-size: 100MB

#Mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #驼峰命名映射开关
    map-underscore-to-camel-case: true
  # Mapper XML 放在 resources/eduadmin/Mapper 下，路径要和包名对得上。
  # 原来是 classpath:mapper/*.xml（对应 resources/mapper/），* 不跨目录，指不到带子目录的路径。
  # 两边对不上时 MyBatis 不会启动报错，只在调用时报 Invalid bound statement，很难查。
  mapper-locations: classpath:eduadmin/Mapper/*.xml

#PBAC 权限开关
pbac:
  # true:开启权限校验  false:关闭（所有 @RequiresPermission 接口直接放行，用于排错）
  # 留着这个开关是为了应对"权限数据配乱了导致全员 403"的场面：
  # 可以先关掉开关恢复系统可用，再去修数据，而不是手忙脚乱改代码重新打包
  enabled: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
#阿里云
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: not-funny
    region: cn-beijing
